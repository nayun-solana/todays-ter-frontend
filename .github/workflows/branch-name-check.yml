name: Branch Name Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          branch="${{ github.head_ref }}"
          pattern='^feature/todays-ter-[0-9]+$'

          if [ "$branch" = "feature/4-issue-tiket" ]; then
            echo "Allowing migration branch: $branch"
            exit 0
          fi

          if [[ ! "$branch" =~ $pattern ]]; then
            echo "Invalid branch name: $branch"
            echo "Expected format: feature/todays-ter-<issue-number>"
            echo "Example: feature/todays-ter-13"
            exit 1
          fi

          echo "Valid branch name: $branch"
