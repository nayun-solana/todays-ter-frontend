<!doctype html>
<!-- lang="en"(Vite 기본값)이면 크롬이 영어 페이지로 보고 한국어 UI를 재번역해 문구가 깨진다. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 대부분의 화면이 흰 헤더로 시작한다. 홈·로그인처럼 다른 화면은 useTopColor로 덮어쓴다. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>오늘의 터</title>

    <!-- 링크 미리보기(카카오톡·슬랙 등). SPA라 정적 태그 하나로 전 페이지가 같은 미리보기를 쓴다.
         장소별 미리보기는 서버 렌더링이 필요해 범위 밖.
         ⚠️ og:image·og:url은 반드시 절대 URL — 카카오 스크래퍼는 상대경로를 해석하지 않는다. -->
    <meta name="description" content="사주 기반으로 오늘 나에게 맞는 장소를 추천해드려요." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="오늘의 터" />
    <meta property="og:title" content="오늘의 터" />
    <meta property="og:description" content="사주 기반으로 오늘 나에게 맞는 장소를 추천해드려요." />
    <meta property="og:url" content="https://todays-ter-frontend.vercel.app/" />
    <!-- 임시 대표 이미지(장소 샘플). 브랜드 이미지 나오면 교체 -->
    <meta property="og:image" content="https://todays-ter-frontend.vercel.app/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
